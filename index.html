<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>멘탈이완전나가버렸습니다</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  }

  .bg-flash {
    position: fixed;
    inset: 0;
    animation: bgFlash 0.4s infinite alternate;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes bgFlash {
    0%   { background: #0a0a0a; }
    20%  { background: #1a001a; }
    40%  { background: #000a1a; }
    60%  { background: #0a0a00; }
    80%  { background: #1a0000; }
    100% { background: #001a0a; }
  }

  .sparks {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .spark {
    position: absolute;
    border-radius: 50%;
    animation: sparkMove linear infinite;
  }

  @keyframes sparkMove {
    0%   { transform: translateY(110vh) scale(1); opacity: 1; }
    100% { transform: translateY(-10vh) scale(0.2); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px 20px;
  }

  .main-text {
    font-size: clamp(40px, 10vw, 100px);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1.1;
    animation: textChaos 0.15s infinite;
    position: relative;
    display: inline-block;
  }

  .main-text span {
    display: inline-block;
    animation: letterSpin 0.3s infinite alternate;
  }

  .main-text span:nth-child(odd)  { animation-delay: 0.05s; color: #ff3cac; text-shadow: 0 0 20px #ff3cac, 0 0 60px #ff3cac; }
  .main-text span:nth-child(even) { animation-delay: 0.12s; color: #00f0ff; text-shadow: 0 0 20px #00f0ff, 0 0 60px #00f0ff; }
  .main-text span:nth-child(3n)   { color: #fcfc00; text-shadow: 0 0 20px #fcfc00, 0 0 60px #fcfc00; }
  .main-text span:nth-child(5n)   { color: #39ff14; text-shadow: 0 0 20px #39ff14, 0 0 60px #39ff14; }

  @keyframes letterSpin {
    0%   { transform: rotate(-5deg) scale(1.0); }
    50%  { transform: rotate(5deg) scale(1.08); }
    100% { transform: rotate(-3deg) scale(1.0); }
  }

  @keyframes textChaos {
    0%   { filter: blur(0px); }
    30%  { filter: blur(1px) drop-shadow(4px 0 0 #ff3cac) drop-shadow(-4px 0 0 #00f0ff); }
    60%  { filter: blur(0px); }
    80%  { filter: blur(2px); }
    100% { filter: blur(0px); }
  }

  .sub-text {
    margin-top: 30px;
    font-size: clamp(18px, 4vw, 36px);
    color: #fff;
    opacity: 0.85;
    animation: subBounce 0.6s infinite alternate;
    text-shadow: 0 0 10px #fff8;
  }

  @keyframes subBounce {
    0%   { transform: translateY(0) rotate(-1deg); }
    100% { transform: translateY(-8px) rotate(1deg); }
  }

  .emoji-ring {
    font-size: clamp(30px, 6vw, 60px);
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .emoji-ring span {
    display: inline-block;
    animation: emojiSpin 1s infinite linear;
  }

  .emoji-ring span:nth-child(1) { animation-delay: 0.0s; }
  .emoji-ring span:nth-child(2) { animation-delay: 0.1s; }
  .emoji-ring span:nth-child(3) { animation-delay: 0.2s; }
  .emoji-ring span:nth-child(4) { animation-delay: 0.3s; }
  .emoji-ring span:nth-child(5) { animation-delay: 0.4s; }
  .emoji-ring span:nth-child(6) { animation-delay: 0.5s; }
  .emoji-ring span:nth-child(7) { animation-delay: 0.6s; }

  @keyframes emojiSpin {
    0%   { transform: scale(1) rotate(0deg); }
    25%  { transform: scale(1.4) rotate(20deg); }
    50%  { transform: scale(1) rotate(0deg); }
    75%  { transform: scale(1.3) rotate(-20deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .glitch-bar {
    height: 4px;
    margin: 24px auto;
    width: 80%;
    max-width: 600px;
    border-radius: 2px;
    background: linear-gradient(90deg, #ff3cac, #00f0ff, #fcfc00, #39ff14, #ff3cac);
    background-size: 300% 100%;
    animation: barSlide 0.8s linear infinite;
  }

  @keyframes barSlide {
    0%   { background-position: 0% 0; }
    100% { background-position: 300% 0; }
  }

  .sound-btn {
    margin-top: 30px;
    padding: 14px 40px;
    font-size: 20px;
    font-weight: 900;
    color: #0a0a0a;
    background: linear-gradient(90deg, #ff3cac, #fcfc00, #00f0ff);
    background-size: 200% 100%;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    animation: btnColor 1s linear infinite;
    letter-spacing: 2px;
    position: relative;
    overflow: hidden;
  }

  @keyframes btnColor {
    0%   { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }

  .sound-btn:active {
    transform: scale(0.95);
  }

  .counter {
    margin-top: 24px;
    font-size: 16px;
    color: #ff3cac;
    opacity: 0.8;
    text-shadow: 0 0 8px #ff3cac;
    letter-spacing: 1px;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: #111;
    border: 2px solid #ff3cac;
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 0 60px #ff3cac88;
    animation: modalPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes modalPop {
    from { transform: scale(0.5) rotate(-10deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);   opacity: 1; }
  }

  .modal p {
    font-size: 28px;
    color: #fff;
    margin-bottom: 20px;
    font-weight: 900;
  }

  .modal button {
    padding: 10px 30px;
    font-size: 16px;
    font-weight: 700;
    color: #0a0a0a;
    background: #ff3cac;
    border: none;
    border-radius: 30px;
    cursor: pointer;
  }

  /* 파란 하늘 배경 */
  .sky-bg {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: linear-gradient(180deg, #87ceeb 0%, #b0e0ff 50%, #e0f7ff 100%);
    animation: skyFadeIn 1.2s ease forwards;
    overflow: hidden;
  }

  .sky-bg.active { display: block; }

  @keyframes skyFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 50px;
    opacity: 0.9;
    animation: cloudDrift linear infinite;
  }

  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }

  @keyframes cloudDrift {
    from { transform: translateX(-300px); }
    to   { transform: translateX(110vw); }
  }

  .sun {
    position: absolute;
    top: 60px;
    right: 120px;
    width: 90px;
    height: 90px;
    background: #ffe066;
    border-radius: 50%;
    box-shadow: 0 0 40px #ffe066, 0 0 80px #ffcc0088;
    animation: sunPulse 2s ease-in-out infinite alternate;
  }

  @keyframes sunPulse {
    from { box-shadow: 0 0 40px #ffe066, 0 0 80px #ffcc0088; }
    to   { box-shadow: 0 0 60px #ffe066, 0 0 120px #ffcc00bb; }
  }

  .bird {
    position: absolute;
    animation: birdFly linear infinite;
    font-size: 28px;
  }

  @keyframes birdFly {
    from { transform: translateX(-60px) translateY(0); }
    to   { transform: translateX(110vw) translateY(-40px); }
  }

  /* 회복완료 모달 */
  .recovery-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .recovery-overlay.active { display: flex; }

  .recovery-modal {
    background: #fff;
    border-radius: 30px;
    padding: 50px 60px;
    text-align: center;
    box-shadow: 0 20px 80px #00aaff55, 0 0 0 4px #87ceeb;
    animation: recoveryBounce 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
    max-width: 480px;
    width: 90%;
  }

  @keyframes recoveryBounce {
    0%   { transform: scale(0) rotate(-15deg); opacity: 0; }
    60%  { transform: scale(1.12) rotate(3deg); opacity: 1; }
    80%  { transform: scale(0.96) rotate(-1deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .recovery-title {
    font-size: 44px;
    font-weight: 900;
    color: #0077cc;
    letter-spacing: -1px;
    margin-bottom: 10px;
    animation: titleRainbow 1.5s linear infinite;
  }

  @keyframes titleRainbow {
    0%   { color: #0077cc; }
    25%  { color: #00aa55; }
    50%  { color: #ff6600; }
    75%  { color: #cc00ff; }
    100% { color: #0077cc; }
  }

  .recovery-sub {
    font-size: 22px;
    font-weight: 700;
    color: #333;
    margin: 12px 0 24px;
    line-height: 1.5;
  }

  .recovery-emojis {
    font-size: 40px;
    margin: 16px 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    animation: emojiParty 0.5s infinite alternate;
  }

  @keyframes emojiParty {
    from { transform: rotate(-3deg) scale(1); }
    to   { transform: rotate(3deg) scale(1.1); }
  }

  .recovery-btn {
    margin-top: 24px;
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(90deg, #0077cc, #00ccaa);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 20px #0077cc44;
    transition: transform 0.1s;
  }

  .recovery-btn:active { transform: scale(0.96); }

  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 14px;
    border-radius: 2px;
    opacity: 0;
    animation: confettiFall linear forwards;
    z-index: 300;
    pointer-events: none;
  }

  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="bg-flash"></div>
<div class="sparks" id="sparks"></div>

<div class="container">
  <div class="main-text" id="mainText"></div>

  <div class="glitch-bar"></div>

  <div class="emoji-ring">
    <span>🤯</span><span>💥</span><span>😵‍💫</span><span>⚡</span><span>🫠</span><span>💀</span><span>🔥</span>
  </div>

  <div class="sub-text">멘탈은 어디 갔나요...</div>

  <div class="glitch-bar"></div>

  <button class="sound-btn" onclick="onBtnClick()">🆘 멘탈 충전하기 🆘</button>

  <div class="counter" id="counter">멘탈 나간 횟수: 0번</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <p>멘탈 회복 시도중... 😅<br>실패했습니다 🫠</p>
    <button onclick="closeModal()">다시 나가기</button>
  </div>
</div>

<div class="sky-bg" id="skyBg">
  <div class="sun"></div>
</div>

<div class="recovery-overlay" id="recoveryOverlay">
  <div class="recovery-modal">
    <div class="recovery-title">🎉 멘탈 회복 완료! 🎉</div>
    <div class="recovery-emojis">😌 🌈 ✨ 🌸 💪</div>
    <div class="recovery-sub">드디어 해냈군요...<br>맑은 하늘처럼 마음도 맑아졌습니다!</div>
    <button class="recovery-btn" onclick="resetAll()">🔄 다시 나가버리기</button>
  </div>
</div>

<script>
const text = "멘탈이완전나가버렸습니다";
const el = document.getElementById("mainText");
[...text].forEach(ch => {
  const s = document.createElement("span");
  s.textContent = ch;
  el.appendChild(s);
});

const colors = ["#ff3cac","#00f0ff","#fcfc00","#39ff14","#ff6600","#cc00ff"];
const sparksEl = document.getElementById("sparks");

function makeSpark() {
  const s = document.createElement("div");
  s.className = "spark";
  const size = Math.random() * 10 + 4;
  const color = colors[Math.floor(Math.random() * colors.length)];
  s.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random() * 100}%;
    bottom:-10px;
    background:${color};
    box-shadow: 0 0 ${size*2}px ${color};
    animation-duration:${Math.random() * 2 + 1}s;
    animation-delay:${Math.random() * 0.5}s;
  `;
  sparksEl.appendChild(s);
  setTimeout(() => s.remove(), 3500);
}

setInterval(makeSpark, 80);

let count = 0;
let target = Math.floor(Math.random() * 10) + 1;
const counter = document.getElementById("counter");

function onBtnClick() {
  count++;
  counter.textContent = `멘탈 나간 횟수: ${count}번`;

  if (count >= target) {
    showRecovery();
    return;
  }

  document.getElementById("modal").classList.add("active");
  for(let i = 0; i < 30; i++) setTimeout(makeSpark, i * 30);
}

function closeModal() {
  document.getElementById("modal").classList.remove("active");
}

document.getElementById("modal").addEventListener("click", function(e) {
  if(e.target === this) closeModal();
});

function showRecovery() {
  document.getElementById("modal").classList.remove("active");

  // 하늘 배경 켜기
  const sky = document.getElementById("skyBg");
  sky.classList.add("active");

  // 구름 생성
  for (let i = 0; i < 6; i++) {
    const c = document.createElement("div");
    c.className = "cloud";
    const w = 100 + Math.random() * 160;
    const h = 40 + Math.random() * 30;
    const top = 10 + Math.random() * 40;
    const dur = 18 + Math.random() * 20;
    const delay = -Math.random() * dur;
    c.style.cssText = `width:${w}px;height:${h}px;top:${top}%;left:-300px;animation-duration:${dur}s;animation-delay:${delay}s;`;
    c.innerHTML = `<span style="position:absolute;width:${h*1.4}px;height:${h*1.4}px;background:#fff;border-radius:50%;top:-${h*0.5}px;left:${w*0.2}px;"></span><span style="position:absolute;width:${h*1.1}px;height:${h*1.1}px;background:#fff;border-radius:50%;top:-${h*0.3}px;left:${w*0.5}px;"></span>`;
    sky.appendChild(c);
  }

  // 새 생성
  const birds = ["🐦","🕊️","🦋"];
  for (let i = 0; i < 4; i++) {
    const b = document.createElement("div");
    b.className = "bird";
    b.textContent = birds[Math.floor(Math.random()*birds.length)];
    const top = 5 + Math.random() * 45;
    const dur = 8 + Math.random() * 10;
    const delay = Math.random() * 5;
    b.style.cssText = `top:${top}%;animation-duration:${dur}s;animation-delay:${delay}s;`;
    sky.appendChild(b);
  }

  // 회복 모달 + 컨페티
  setTimeout(() => {
    document.getElementById("recoveryOverlay").classList.add("active");
    launchConfetti();
  }, 800);
}

function launchConfetti() {
  const colors = ["#0077cc","#00ccaa","#ff3cac","#fcfc00","#39ff14","#ff6600","#cc00ff"];
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const p = document.createElement("div");
      p.className = "confetti-piece";
      p.style.cssText = `
        left:${Math.random()*100}%;
        top:0;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        transform:rotate(${Math.random()*360}deg);
        animation-duration:${1.5+Math.random()*2}s;
        animation-delay:${Math.random()*0.5}s;
      `;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 4000);
    }, i * 20);
  }
}

function resetAll() {
  count = 0;
  target = Math.floor(Math.random() * 10) + 1;
  counter.textContent = "멘탈 나간 횟수: 0번";
  document.getElementById("recoveryOverlay").classList.remove("active");
  const sky = document.getElementById("skyBg");
  sky.classList.remove("active");
  // 구름, 새 제거
  [...sky.querySelectorAll(".cloud,.bird")].forEach(el => el.remove());
}

const spans = el.querySelectorAll("span");
setInterval(() => {
  spans.forEach(s => {
    const r = Math.random();
    if (r < 0.15) s.style.transform = `translateY(${(Math.random()-0.5)*20}px) rotate(${(Math.random()-0.5)*30}deg)`;
    else s.style.transform = "";
  });
}, 200);
</script>
</body>
</html>
